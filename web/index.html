<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModSync</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" class="app">
    <header class="top">
      <div class="brand"><img class="appicon" src="/icon.png" alt="ModSync"><div class="word">MODSYNC</div><span class="chip">Living Room</span></div>
      <div class="topright">
        <button id="update-btn" class="chip chipbtn hidden" data-action="update-app" data-focusable data-key="update">Update</button>
        <button id="storage-btn" class="chip chipbtn" data-action="storage" data-focusable data-key="storage">Storage</button>
        <div id="pc" class="pc"><span class="dot"></span><span>PC</span></div>
      </div>
    </header>
    <div class="content">
      <main id="main" class="main"></main>
      <aside id="library" class="library"></aside>
    </div>
    <footer class="footer">
      <div class="note">Mods only in v1</div>
    </footer>
    <div id="overlay" class="overlay hidden"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
