name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only; do not publish a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check the installer
        run: bash -n packaging/install.sh

      - name: Resolve and check the version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::Tag ${tag} does not match package.json v${version}."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${tag}"

  build:
    name: AppImage
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build the AppImage
        run: npx electron-builder --linux AppImage --publish never

      - name: Package the installer and artwork
        run: |
          set -euo pipefail
          cp packaging/install.sh release/install.sh
          chmod +x release/install.sh
          (cd packaging/steam-art \
            && zip -q "$GITHUB_WORKSPACE/release/steam-art.zip" \
                 hero.png portrait.png header.png logo.png icon.png)

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release/*.AppImage
            release/install.sh
            release/steam-art.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: [verify, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: artifacts

      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: node scripts/release-notes.mjs "$TAG" > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --notes-file notes.md
          fi
